name: ML Pipeline CI/CD — User Behaviour Classification

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"
  DATASET_FILE: "user_behaviour_dataset.csv"
  MODEL_ARTIFACT: "best_model.pkl"
  DASHBOARD_ARTIFACT: "ml_results_dashboard.png"

jobs:

  # ══════════════════════════════════════════
  # JOB 1 — Lint & Code Quality
  # ══════════════════════════════════════════
  lint:
    name: 🔍 Lint & Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-lint-

      - name: Install linting tools
        run: pip install flake8 black isort

      - name: flake8
        run: flake8 . --max-line-length=120 --exclude=__pycache__ --statistics --count

      - name: black
        run: black --check --line-length=120 .

      - name: isort
        run: isort --check-only --line-length=120 .


  # ══════════════════════════════════════════
  # JOB 2 — Install Dependencies
  # ══════════════════════════════════════════
  install:
    name: 📦 Install Dependencies
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify imports
        run: |
          python -c "
          import sklearn, numpy, pandas, matplotlib, joblib, flask
          print('✓ sklearn    :', sklearn.__version__)
          print('✓ numpy      :', numpy.__version__)
          print('✓ pandas     :', pandas.__version__)
          print('✓ matplotlib :', matplotlib.__version__)
          print('✓ joblib     :', joblib.__version__)
          print('✓ flask      :', flask.__version__)
          "


  # ══════════════════════════════════════════
  # JOB 3 — Train ML Models
  # ══════════════════════════════════════════
  train:
    name: 🤖 Train ML Models
    runs-on: ubuntu-latest
    needs: install

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check dataset
        run: |
          [ -f "${{ env.DATASET_FILE }}" ] \
            && echo "✓ Dataset found: $(wc -l < ${{ env.DATASET_FILE }}) rows" \
            || (echo "✗ Dataset not found: ${{ env.DATASET_FILE }}" && exit 1)

      - name: Train models
        run: |
          export MPLBACKEND=Agg
          python main.py

      - name: Verify outputs
        run: |
          [ -f "${{ env.MODEL_ARTIFACT }}" ]     && echo "✓ best_model.pkl found"      || (echo "✗ best_model.pkl missing"      && exit 1)
          [ -f "${{ env.DASHBOARD_ARTIFACT }}" ] && echo "✓ Dashboard PNG found"       || (echo "✗ Dashboard PNG missing"       && exit 1)

      - name: Log best model
        run: MPLBACKEND=Agg python -c "import main; import joblib; b = joblib.load('${{ env.MODEL_ARTIFACT }}'); print('Best model :', b['model_name']); print('Accuracy   :', round(b['accuracy']*100,2)); print('Features   :', b['features'])"

      - name: Upload best_model.pkl
        uses: actions/upload-artifact@v4
        with:
          name: best-model
          path: ${{ env.MODEL_ARTIFACT }}
          retention-days: 30

      - name: Upload dashboard
        uses: actions/upload-artifact@v4
        with:
          name: ml-dashboard
          path: ${{ env.DASHBOARD_ARTIFACT }}
          retention-days: 30


  # ══════════════════════════════════════════
  # JOB 4 — Model Validation Gate
  # ══════════════════════════════════════════
  validate:
    name: ✅ Model Validation Gate
    runs-on: ubuntu-latest
    needs: train

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download best_model.pkl
        uses: actions/download-artifact@v4
        with:
          name: best-model
          path: .

      - name: Validate model
        run: MPLBACKEND=Agg python validate_model.py


  # ══════════════════════════════════════════
  # JOB 5 — Deploy (main only)
  # ══════════════════════════════════════════
  deploy:
    name: 🚀 Deploy Best Model
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Download best_model.pkl
        uses: actions/download-artifact@v4
        with:
          name: best-model
          path: .

      - name: Download dashboard
        uses: actions/download-artifact@v4
        with:
          name: ml-dashboard
          path: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "model-v${{ github.run_number }}"
          name: "ML Model Release #${{ github.run_number }}"
          body: |
            ## 🤖 User Behaviour Classification Model

            **Commit**: `${{ github.sha }}`

            ### Artifacts
            - `best_model.pkl` — Trained model bundle
            - `ml_results_dashboard.png` — Model comparison dashboard

            ### Info
            - Dataset: `user_behaviour_dataset.csv`
            - Target: Low / Medium / High behaviour classes
            - Features: 8 (App_Usage_Time, Screen_On_Time, Battery_Drain, Num_Apps_Installed, Data_Usage, Age, Gender, OS)
            - Algorithms: LWR, Weighted Regression, SVM, KMeans, Decision Tree, Rule-Based

            > Auto-deployed by GitHub Actions
          files: |
            best_model.pkl
            ml_results_dashboard.png
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "✓ Model deployed as Release v${{ github.run_number }}"
